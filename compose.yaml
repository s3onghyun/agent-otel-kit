# agent-otel-kit: local observability stack for AI coding agents.
#
#   docker compose up -d                    collector, Prometheus, Loki, Tempo, Grafana
#   docker compose --profile perses up -d   the same plus Perses
#
# Every port is bound to 127.0.0.1. Images are pinned by tag and by the
# multi-arch index digest they were verified with; memory limits keep the
# whole stack under about 2.5 GiB.

name: agent-otel-kit

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      AGENT_OTEL_KIT_CAPTURE_CONTENT: ${AGENT_OTEL_KIT_CAPTURE_CONTENT:-false}
      AGENT_OTEL_KIT_KEEP_EMAIL: ${AGENT_OTEL_KIT_KEEP_EMAIL:-false}
    volumes:
      - ./collector:/etc/otelcol:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:8888:8888"   # collector self-metrics
      - "127.0.0.1:13133:13133" # health check
    depends_on:
      - loki
      - tempo
    mem_limit: 512m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --enable-feature=created-timestamp-zero-ingestion,promql-extended-range-selectors
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 512m
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 512m
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.10@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38
    command: ["-config.file=/etc/tempo/config.yaml"]
    user: "10001"
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.14@sha256:ae509d9ae8c1021ca32ec370a9ca975d40165eda9fccd1e1102d317ff8787cd7
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agent-cost-tokens.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    mem_limit: 384m
    restart: unless-stopped

  perses:
    image: persesdev/perses:v0.55.0@sha256:bda9946544da8086cfd2e34d586ca17036b1e8f53b4a52530773bc5b93f721c0
    profiles: ["perses"]
    command: ["--config=/etc/perses/config.yaml"]
    volumes:
      - ./perses/config.yaml:/etc/perses/config.yaml:ro
      - ./perses/provisioning:/etc/perses/provisioning:ro
      - perses-data:/perses
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - prometheus
      - tempo
    mem_limit: 256m
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  perses-data:
